name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-exe:
    name: Build portable exe (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart('v')
          Write-Host "package.json = $version, tag = $tag"
          if ($version -ne $tag) {
            throw "Tag $tag does not match package.json version $version. Bump the version or move the tag."
          }

      - name: Build portable exe
        run: npm run dist

      - name: Collect build info
        shell: pwsh
        run: |
          $exe = Get-Item dist/C.pet.exe
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          "SIZE_BYTES=$($exe.Length)" >> $env:GITHUB_ENV
          "SHA256=$hash"           >> $env:GITHUB_ENV
          @(
            "### C.pet.exe",
            "",
            "- Windows x64 portable build",
            "- size: ``$($exe.Length)`` bytes",
            "- sha256: ``$hash``",
            ""
          ) >> $env:GITHUB_STEP_SUMMARY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: C.pet-${{ github.ref_name }}
          path: dist/C.pet.exe
          if-no-files-found: error
          retention-days: 14

      - name: Attach exe to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag exists - replacing the asset."
            gh release upload $tag dist/C.pet.exe --clobber
          } else {
            Write-Host "Release $tag not found - creating it."
            gh release create $tag dist/C.pet.exe --title "C.pet $tag" --generate-notes
          }

      - name: Summary
        shell: pwsh
        run: |
          Write-Host "Artifact: dist/C.pet.exe"
          Write-Host "Size:     $env:SIZE_BYTES bytes"
          Write-Host "SHA-256:  $env:SHA256"
