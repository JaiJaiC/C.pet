<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C.pet</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="pet-page">
    <main class="desktop-pet" aria-label="C.pet desktop pet">
      <button class="pet" id="pet" type="button" aria-label="Open To Do">
        <span class="pet-shadow" aria-hidden="true"></span>
        <img id="petImage" src="assets/pet.png" alt="Cartoon desktop pet" draggable="false" />
        <span class="pet-style" id="petStyle" aria-hidden="true">
          <span class="pet-effect"></span>
        </span>
      </button>
    </main>
    <script src="app.js"></script>
  </body>
</html>
